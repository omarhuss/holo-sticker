<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Holo Sticker</title>
<style>
  :root { color-scheme: dark; --bg: #1c1d1f; --ink: #e6f5c4; --line: rgba(180, 230, 80, .45); }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .ui {
    position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
    font: 500 13px/1 system-ui, -apple-system, sans-serif; color: var(--ink); letter-spacing: .02em; white-space: nowrap;
  }
  #hint { margin: 0; opacity: .5; pointer-events: none; }
  #tilt-btn:not([hidden]) + #hint { display: none; }
  @media (orientation: landscape) and (max-height: 500px) { .ui { left: auto; right: max(16px, env(safe-area-inset-right, 0px)); transform: none; } }
  #tilt-btn { font-weight: 600; font-size: 14px; background: rgba(28, 30, 32, .85); border: 1px solid var(--line); border-radius: 999px; padding: 12px 20px; cursor: pointer; }
  #tilt-btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
  #err { position: fixed; left: 12px; right: 12px; top: 12px; margin: 0; color: #f88; font: 12px/1.4 ui-monospace, monospace; white-space: pre-wrap; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="tilt-btn" class="ui" hidden>Enable tilt</button>
<p id="hint" class="ui"></p>
<pre id="err"></pre>
<script>
'use strict';

/*
 * Holographic "genuine part" sticker, rendered with parallax occlusion mapping.
 * One height map (coin + relief) is built once on a 2D canvas / Float32 arrays;
 * the fragment shader ray-marches it along the tilt-derived view vector so the
 * coin reads as a thick raised disc with real side walls.
 *
 * Tilt comes from the mouse (desktop), the gyroscope (phones, HTTPS only) or a touch drag.
 * options: { text, seed, tilt: [x, y] | null, reducedMotion, tiltButton, onSource(name) }
 */
function createHoloSticker(canvas, opts = {}) {
  const N = 1024;                 // map resolution
  const ASPECT = 1.03;            // sticker height / width
  const COIN = { x: 0.505, y: 0.375, a: 0.33, b: 0.20, rot: -0.14 }; // sticker-width units, y down
  const MAX_ROT = opts.reducedMotion ? 0.08 : 0.26;                 // plane rotation at full tilt (rad)
  const GYRO_RANGE = 25;          // degrees of phone tilt for full effect

  const rand = mulberry32((opts.seed ?? Math.random() * 2 ** 32) >>> 0);
  const serial = Array.from({ length: 7 }, () => String.fromCharCode(65 + Math.floor(rand() * 26))).join('');
  const raw = (opts.text || 'GENUINE').toUpperCase().replace(/[^A-Z0-9 ]/g, '').trim(), cut = raw.slice(0, 16);
  const word = (raw.length > 16 && cut.includes(' ') ? cut.slice(0, cut.lastIndexOf(' ')) : cut) || 'GENUINE';
  const seed = (rand() * 997) | 0;

  const gl = canvas.getContext('webgl2', { antialias: false, preserveDrawingBuffer: !!opts.tilt });
  if (!gl) throw new Error('WebGL2 is not available');

  // ---------- GL setup (re-run after a lost context) ----------
  const maps = buildMaps();
  let u;
  function initGL() {
    const prog = program(VERT, FRAG);
    gl.useProgram(prog);
    u = {};
    for (const name of ['uRes', 'uSize', 'uRot', 'uTilt', 'uCoin', 'uCoinRot', 'uSeed', 'uRelief', 'uSurf']) u[name] = gl.getUniformLocation(prog, name);
    texture(0, maps.relief); texture(1, maps.surf);
    gl.uniform1i(u.uRelief, 0); gl.uniform1i(u.uSurf, 1);
    gl.uniform4f(u.uCoin, COIN.x, COIN.y, COIN.a, COIN.b);
    gl.uniform1f(u.uCoinRot, COIN.rot);
    gl.uniform1f(u.uSeed, seed);
  }
  initGL();
  canvas.addEventListener('webglcontextlost', e => e.preventDefault());
  canvas.addEventListener('webglcontextrestored', () => { initGL(); resize(); draw(); });

  // ---------- input ----------
  // Convention for every source: tilt.x > 0 pushes the right edge away, tilt.y > 0 the bottom edge.
  const tilt = { x: 0, y: 0 }, target = { x: 0, y: 0 };
  const clamp = v => Math.max(-1, Math.min(1, v));
  let lastInput = -1e9, lastOrient = -1e9, lastMouse = -1e9, drag = null, q0 = null, qT = 0, source = '';
  const setSource = s => { if (s !== source) { source = s; opts.onSource?.(s); } };

  if (opts.tilt) {
    tilt.x = target.x = opts.tilt[0]; tilt.y = target.y = opts.tilt[1];
  } else {
    setSource(matchMedia('(hover: hover)').matches ? 'mouse' : 'touch');
    const gyroOn = () => performance.now() - lastOrient < 1000;
    addEventListener('pointermove', e => {
      if (e.pointerType === 'mouse') {
        target.x = clamp(e.clientX / innerWidth * 2 - 1);
        target.y = clamp(e.clientY / innerHeight * 2 - 1);
        lastMouse = performance.now();
      } else if (drag && e.pointerId === drag.id && !gyroOn()) {   // touch: relative drag
        const s = 2.5 / Math.min(innerWidth, innerHeight);
        target.x = clamp(drag.tx + (e.clientX - drag.x) * s);
        target.y = clamp(drag.ty + (e.clientY - drag.y) * s);
      } else return;
      lastInput = performance.now();
    });
    canvas.addEventListener('pointerdown', e => {
      if (e.pointerType === 'mouse') return;
      drag = { id: e.pointerId, x: e.clientX, y: e.clientY, tx: tilt.x, ty: tilt.y };
      target.x = tilt.x; target.y = tilt.y; idleW = 0;                 // freeze where the finger lands
    });
    const endDrag = e => { if (drag && e.pointerId === drag.id) drag = null; };
    addEventListener('pointerup', endDrag);
    addEventListener('pointercancel', endDrag);

    // Gyro: compose the W3C Z-X'-Y'' Euler angles into a quaternion and measure how far the screen normal
    // has turned from a neutral pose. No gimbal flips near vertical, and yaw counts too.
    // The neutral pose slowly follows the phone (5 s), so however you hold it, that becomes "flat".
    const D = Math.PI / 360, SIN_MAX = Math.sin(GYRO_RANGE * Math.PI / 180);
    const onOrient = e => {
      if (e.beta == null || e.gamma == null) return;
      const [ca, sa] = [Math.cos((e.alpha || 0) * D), Math.sin((e.alpha || 0) * D)];
      const [cb, sb] = [Math.cos(e.beta * D), Math.sin(e.beta * D)];
      const [cg, sg] = [Math.cos(e.gamma * D), Math.sin(e.gamma * D)];
      const q = [ca * cb * cg - sa * sb * sg, ca * sb * cg - sa * cb * sg, ca * cb * sg + sa * sb * cg, sa * cb * cg + ca * sb * sg]; // w x y z
      const now = performance.now();
      if (!q0 || now - lastOrient > 1000) q0 = q.slice();               // first reading, or resumed after a pause
      else {
        if (q0[0] * q[0] + q0[1] * q[1] + q0[2] * q[2] + q0[3] * q[3] < 0) q.forEach((v, i) => q[i] = -v);
        const f = 1 - Math.exp(-(now - qT) / 5000);
        const m = q0.map((v, i) => v + (q[i] - v) * f), l = Math.hypot(...m);
        q0 = m.map(v => v / l);
      }
      lastOrient = qT = now;
      if (now - lastMouse < 1500) return;                              // iPad + trackpad: pointer wins while in use
      // r = conj(q0) * q; deflection = minus the neutral screen normal seen from the CURRENT device frame,
      // so an in-plane spin (e.g. turning to landscape) never skews the axes while q0 catches up
      const [aw, ax, ay, az] = [q0[0], -q0[1], -q0[2], -q0[3]], [bw, bx, by, bz] = q;
      const rw = aw * bw - ax * bx - ay * by - az * bz, rx = aw * bx + ax * bw + ay * bz - az * by;
      const ry = aw * by - ax * bz + ay * bw + az * bx, rz = aw * bz + ax * by - ay * bx + az * bw;
      const vx = 2 * (rw * ry - rx * rz), vy = -2 * (ry * rz + rw * rx);
      // window.orientation first: iOS 16.4-16.7 reports screen.orientation.angle clockwise (WebKit bug 254863)
      const a = (typeof window.orientation === 'number' ? window.orientation : (screen.orientation ? screen.orientation.angle : 0)) * Math.PI / 180;
      target.x = clamp((vx * Math.cos(a) - vy * Math.sin(a)) / SIN_MAX);
      target.y = clamp(-(vx * Math.sin(a) + vy * Math.cos(a)) / SIN_MAX);
      setSource('gyro');
    };
    const listen = () => addEventListener('deviceorientation', onOrient);
    const needsPermission = typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function';
    if (!needsPermission) listen();
    else if (navigator.maxTouchPoints > 0 && opts.tiltButton) {      // iOS / iPadOS: needs a tap first
      const btn = opts.tiltButton;
      const ask = fromTap => DeviceOrientationEvent.requestPermission().then(state => {
        if (state === 'granted') { listen(); btn.hidden = true; }
        else if (fromTap) { btn.textContent = 'Motion access is off, drag to tilt'; btn.disabled = true; setTimeout(() => btn.hidden = true, 4000); }
      }, () => { btn.hidden = fromTap; });                             // load-time call rejects = a tap can prompt
      btn.addEventListener('click', () => ask(true));
      ask(false);                                                      // already granted this session? then no tap needed
    }
  }

  // ---------- render ----------
  let dpr = 0, drawn = null;
  function resize() {
    dpr = Math.min(2, devicePixelRatio || 1);
    canvas.width = Math.round(canvas.clientWidth * dpr);
    canvas.height = Math.round(canvas.clientHeight * dpr);
    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.uniform2f(u.uRes, canvas.width, canvas.height);
    gl.uniform1f(u.uSize, Math.min(0.7 * canvas.clientWidth, 0.6 * canvas.clientHeight) * dpr);
    drawn = null;
  }

  function draw() {
    const ax = tilt.y * MAX_ROT * 0.85, ay = tilt.x * MAX_ROT;
    const cx = Math.cos(ax), sx = Math.sin(ax), cy = Math.cos(ay), sy = Math.sin(ay);
    // R = Ry(ay) * Rx(ax), column-major. +x tilt pushes the right edge away, +y the bottom edge.
    gl.uniformMatrix3fv(u.uRot, false, [cy, 0, -sy, sy * sx, cx, cy * sx, sy * cx, -sx, cy * cx]);
    gl.uniform2f(u.uTilt, tilt.x, tilt.y);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    drawn = { x: tilt.x, y: tilt.y };
  }

  let idleW = 0, last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    const idle = !opts.reducedMotion && now - lastInput > 3000 && now - lastOrient > 1000 && !drag;
    idleW += ((idle ? 1 : 0) - idleW) * (1 - Math.exp(-dt * (idle ? 1.2 : 4)));
    const t = now / 1000;
    const tx = target.x * (1 - idleW) + idleW * 0.65 * Math.sin(t * 0.7);
    const ty = target.y * (1 - idleW) + idleW * 0.5 * Math.sin(t * 0.53 + 1.3);
    const k = 1 - Math.pow(0.88, dt * 60);
    tilt.x += (tx - tilt.x) * k; tilt.y += (ty - tilt.y) * k;
    if (Math.min(2, devicePixelRatio || 1) !== dpr) resize();          // moved to another screen / zoomed
    if (!drawn || Math.abs(tilt.x - drawn.x) + Math.abs(tilt.y - drawn.y) > 2e-4) draw(); // idle GPU when settled
    requestAnimationFrame(frame);
  }

  resize();
  draw();                                 // first frame synchronously (test hook relies on it)
  addEventListener('resize', () => { resize(); draw(); });
  if (!opts.tilt) requestAnimationFrame(frame);
  return { serial };

  // ---------- helpers ----------
  function program(vs, fs) {
    const p = gl.createProgram();
    for (const [type, src] of [[gl.VERTEX_SHADER, vs], [gl.FRAGMENT_SHADER, fs]]) {
      const s = gl.createShader(type);
      gl.shaderSource(s, src); gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error('Shader error:\n' + gl.getShaderInfoLog(s));
      gl.attachShader(p, s);
    }
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error('Link error:\n' + gl.getProgramInfoLog(p));
    return p;
  }

  function texture(unit, data) {
    gl.activeTexture(gl.TEXTURE0 + unit);
    gl.bindTexture(gl.TEXTURE_2D, gl.createTexture());
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, N, N, 0, gl.RGBA, gl.UNSIGNED_BYTE, data);
    gl.generateMipmap(gl.TEXTURE_2D);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    // mirrored: parallax pulls the deep floor past the sticker edge; mirroring keeps it seamless
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.MIRRORED_REPEAT);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.MIRRORED_REPEAT);
  }

  function buildMaps() {
    // 1) Vector masks on a 2D canvas: R = coin lettering, G = serial ink, B = cut ticks.
    //    Drawing space is isotropic: 1 sticker width = N px, height = N * ASPECT (squashed into N rows).
    const cv = document.createElement('canvas');
    cv.width = cv.height = N;
    const g = cv.getContext('2d', { willReadFrequently: true });
    g.fillStyle = '#000'; g.fillRect(0, 0, N, N);
    g.globalCompositeOperation = 'lighter';
    g.setTransform(1, 0, 0, 1 / ASPECT, 0, 0);
    const SANS = '"Helvetica Neue", Helvetica, Arial, sans-serif';

    g.save();
    g.translate(COIN.x * N, COIN.y * N); g.rotate(COIN.rot);
    g.fillStyle = '#f00'; g.textAlign = 'center'; g.textBaseline = 'alphabetic';
    const WIDE = 1.15;                                          // horizontal stretch: bold extended look
    g.font = `900 100px "Arial Black", ${SANS}`;
    const fs = Math.min(0.13 * N, 100 * 0.47 * N / (g.measureText(word).width * WIDE));
    g.font = `900 ${fs}px "Arial Black", ${SANS}`;
    const m = g.measureText(word);
    g.scale(WIDE, 1);
    g.fillText(word, 0, (m.actualBoundingBoxAscent - m.actualBoundingBoxDescent) / 2);
    g.scale(1 / WIDE, 1);
    arcText(g, 'CERTIFIED', true, SANS);
    arcText(g, 'ORIGINAL PART', false, SANS);
    g.restore();

    // serial: condensed sans, letter-spaced, centred near the bottom
    g.fillStyle = '#0f0'; g.textAlign = 'left';
    const sfs = 0.072 * N, cond = 0.78, gap = 0.006 * N;
    g.font = `500 ${sfs}px ${SANS}`;
    const ws = [...serial].map(c => g.measureText(c).width * cond);
    let x = 0.5 * N - (ws.reduce((s, w) => s + w, 0) + gap * 6) / 2;
    const baseY = 0.895 * N + 0.36 * sfs;
    [...serial].forEach((c, i) => {
      g.save(); g.translate(x, baseY); g.scale(cond, 1); g.fillText(c, 0, 0); g.restore();
      x += ws[i] + gap;
    });

    // cut ticks: diagonal at the corners, perpendicular at mid-edges
    g.strokeStyle = '#00f'; g.lineWidth = 0.0045 * N; g.lineCap = 'round';
    const W = N, H = N * ASPECT, c0 = 0.024 * N, c1 = 0.072 * N, t = 0.04 * N;
    const seg = (x1, y1, x2, y2) => { g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke(); };
    seg(c0, c0, c1, c1); seg(W - c0, c0, W - c1, c1); seg(c0, H - c0, c1, H - c1); seg(W - c0, H - c0, W - c1, H - c1);
    seg(W / 2, 0, W / 2, t); seg(W / 2, H, W / 2, H - t); seg(0, H / 2, t, H / 2); seg(W, H / 2, W - t, H / 2);

    const px = g.getImageData(0, 0, N, N).data;
    const text = new Float32Array(N * N);
    for (let i = 0; i < N * N; i++) text[i] = px[4 * i] / 255;
    const tb = blur(text, 1, 2);                                // rounded emboss profile for lettering

    // 2) Height fields. hb = background relief, hc = coin profile (extended past its edge), dc = coin SDF.
    const hb = new Float32Array(N * N), hc = new Float32Array(N * N), dc = new Float32Array(N * N);
    const cr = Math.cos(COIN.rot), sr = Math.sin(COIN.rot);
    const M = 512, wg = new Float32Array(M * M);                // water at half res: it's blurred right after anyway
    for (let j = 0; j < M; j++) for (let i = 0; i < M; i++) { const Y = (j + 0.5) / M * ASPECT; wg[j * M + i] = Y > 0.5 ? water((i + 0.5) / M, Y) : 0; }
    const wAt = (i, j) => {
      const fx = Math.min(M - 1, Math.max(0, (i + 0.5) / N * M - 0.5)), fy = Math.min(M - 1, Math.max(0, (j + 0.5) / N * M - 0.5));
      const x0 = fx | 0, y0 = fy | 0, x1 = Math.min(M - 1, x0 + 1), y1 = Math.min(M - 1, y0 + 1), ax = fx - x0, ay = fy - y0;
      return (wg[y0 * M + x0] * (1 - ax) + wg[y0 * M + x1] * ax) * (1 - ay) + (wg[y1 * M + x0] * (1 - ax) + wg[y1 * M + x1] * ax) * ay;
    };
    for (let j = 0; j < N; j++) {
      const Y = (j + 0.5) / N * ASPECT;
      for (let i = 0; i < N; i++) {
        const X = (i + 0.5) / N, k = j * N + i;
        // approx. signed distance to the rotated oval
        const dx = X - COIN.x, dy = Y - COIN.y;
        const lx = cr * dx + sr * dy, ly = -sr * dx + cr * dy;
        const rho = Math.hypot(lx / COIN.a, ly / COIN.b) || 1e-4;
        const d = (rho - 1) / (Math.hypot(lx / (COIN.a * COIN.a), ly / (COIN.b * COIN.b)) / rho || 1e-4);
        dc[k] = d;
        let b = 0.05;
        if (d > 0) b += 0.05 * (0.5 + 0.5 * Math.cos(d * 2 * Math.PI / 0.03)) * Math.exp(-d / 0.09) * smooth(0, 0.01, d); // ripples round the coin
        b += wAt(i, j);
        hb[k] = b;
        hc[k] = coinHeight(-d, tb[k]);
      }
    }
    const hbs = blur(hb, 3, 2);                                 // soft, slightly out-of-focus relief like a real hologram

    // 3) Compose (1-texel antialiased step = the coin's vertical wall), normals, cavity AO.
    const h = new Float32Array(N * N);
    for (let k = 0; k < N * N; k++) h[k] = hbs[k] + (hc[k] - hbs[k]) * Math.min(1, Math.max(0, 0.5 - dc[k] * N));
    const hBlur = blur(h, 12, 2);
    const relief = new Uint8Array(N * N * 4), surf = new Uint8Array(N * N * 4);
    const NS = 70;                                              // slope gain: height units per texel -> normal tilt
    for (let j = 0; j < N; j++) {
      for (let i = 0; i < N; i++) {
        const k = j * N + i, src = dc[k] < 0 ? hc : hbs;          // never differentiate across the wall
        const gx = (src[j * N + Math.min(N - 1, i + 1)] - src[j * N + Math.max(0, i - 1)]) * 0.5 * NS;
        const gy = (src[Math.min(N - 1, j + 1) * N + i] - src[Math.max(0, j - 1) * N + i]) * 0.5 * NS;
        const il = 1 / Math.hypot(gx, gy, 1);
        relief[4 * k] = h[k] * 255;
        relief[4 * k + 1] = (0.5 - 0.5 * gx * il) * 255;
        relief[4 * k + 2] = (0.5 - 0.5 * gy * il) * 255;
        relief[4 * k + 3] = (1 - Math.min(0.55, Math.max(0, hBlur[k] - h[k]) * 1.6)) * 255;
        surf[4 * k] = px[4 * k + 1];                              // serial ink
        surf[4 * k + 1] = px[4 * k + 2];                          // cut ticks
        surf[4 * k + 2] = (1 - (dc[k] < 0 ? 0.3 * tb[k] : 0)) * 255; // lettering slightly darker (relief albedo)
        surf[4 * k + 3] = 255;
      }
    }
    return { relief, surf };
  }

  // coin cross-section, u = depth inside the oval edge (sticker-width units), tm = lettering mask
  function coinHeight(u, tm) {
    if (u < 0.013) { const s = Math.min(1, Math.max(0, u / 0.011)); return 0.84 + 0.16 * Math.sin(s * Math.PI / 2); } // rounded lip (finite slope: no knurl stripes)
    if (u < 0.019) return 1 - 0.07 * smooth(0.013, 0.019, u);   // step down into the ring band
    if (u < 0.062) return 0.93 + 0.05 * tm;                      // ring band with arc text
    if (u < 0.071) return 0.93 + 0.05 * Math.sin(Math.PI * (u - 0.062) / 0.009); // thin inner ridge
    return 0.90 + 0.03 * smooth(0.07, 0.2, u) + 0.07 * tm;       // gently domed face with the word
  }

  // Flowing water below the coin. psi is a stream function (gentle waves + a few eddies);
  // its contour lines give fine swirling striations, and broad ribbons ride along the same flow.
  function water(X, Y) {
    let psi = Y + 0.025 * Math.sin(2 * Math.PI * (1.3 * X + 0.2)) + 0.012 * Math.sin(2 * Math.PI * (3.1 * X - 1.7 * Y + 0.5));
    for (const [ex, ey, s, r] of EDDIES) psi += s * Math.exp(-((X - ex) ** 2 + (Y - ey) ** 2) / (r * r));
    let h = 0.045 * (0.5 + 0.5 * Math.cos(2 * Math.PI * psi * 34)) ** 2;
    for (const [y0, w, amp, gf, ps] of RIBBONS) {
      const mod = 0.6 + 0.4 * Math.sin(2 * Math.PI * (gf * X + ps));
      h += amp * mod * Math.exp(-(((psi - y0) / w) ** 2));
    }
    return h * smooth(0.55, 0.66, psi) * smooth(0, 0.08, Math.min(X, 1 - X, ASPECT - Y)); // flatten at the border so parallax never shows a mirror seam
  }

  // letters along the ring band; top reads outward-up, bottom reads upright toward the centre
  function arcText(g, str, top, font) {
    const ea = (COIN.a - 0.0405) * N, eb = (COIN.b - 0.0405) * N;
    const fs = 0.032 * N, sp = 0.009 * N, dir = top ? 1 : -1, mid = top ? -Math.PI / 2 : Math.PI / 2;
    g.font = `700 ${fs}px ${font}`;
    g.textAlign = 'center';
    const ws = [...str].map(c => g.measureText(c).width + sp);
    let s = -(ws.reduce((a, w) => a + w, 0) - sp) / 2;
    const thetaAt = len => {                                     // walk the arc from the middle until |len| is covered
      let th = mid, acc = 0;
      const st = Math.sign(len) * dir * 0.0005;
      while (acc < Math.abs(len)) {
        const n = th + st;
        acc += Math.hypot(ea * (Math.cos(n) - Math.cos(th)), eb * (Math.sin(n) - Math.sin(th)));
        th = n;
      }
      return th;
    };
    [...str].forEach((c, i) => {
      const th = thetaAt(s + (ws[i] - sp) / 2);
      g.save();
      g.translate(ea * Math.cos(th), eb * Math.sin(th));
      g.rotate(Math.atan2(dir * eb * Math.cos(th), -dir * ea * Math.sin(th)));
      g.fillText(c, 0, 0.36 * fs);
      g.restore();
      s += ws[i];
    });
  }

  function blur(src, r, passes) {              // separable box blur, clamped edges
    const out = Float32Array.from(src), tmp = new Float32Array(src.length), n = 2 * r + 1;
    const pass = (s, d, stride, step) => {
      for (let l = 0; l < N; l++) {
        const o = l * stride;
        let acc = 0;
        for (let i = -r; i <= r; i++) acc += s[o + Math.min(N - 1, Math.max(0, i)) * step];
        for (let i = 0; i < N; i++) {
          d[o + i * step] = acc / n;
          acc += s[o + Math.min(N - 1, i + r + 1) * step] - s[o + Math.max(0, i - r) * step];
        }
      }
    };
    for (let p = 0; p < passes; p++) { pass(out, tmp, N, 1); pass(tmp, out, 1, N); }
    return out;
  }
}

// eddies in the water: x, y, strength, radius. Kept below ~1.1 * radius so lines swerve without closing into blobs.
const EDDIES = [[0.18, 0.80, 0.075, 0.08], [0.58, 0.76, -0.07, 0.075], [0.86, 0.9, 0.06, 0.07], [0.36, 0.97, -0.055, 0.065]];
// broad ribbons along the flow: psi level, half-width, height, along-x modulation freq, phase
const RIBBONS = [[0.67, 0.024, 0.15, 1.7, 0.2], [0.745, 0.03, 0.21, 1.3, 0.6], [0.83, 0.034, 0.23, 2.1, 0.1], [0.915, 0.026, 0.17, 1.5, 0.8], [0.99, 0.028, 0.13, 1.9, 0.5]];

function smooth(a, b, x) { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); }

function mulberry32(a) {
  return () => {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const VERT = `#version 300 es
void main() {
  vec2 p = vec2(float((gl_VertexID << 1) & 2), float(gl_VertexID & 2));
  gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0);
}`;

const FRAG = `#version 300 es
precision highp float;
uniform vec2 uRes, uTilt;
uniform float uSize, uCoinRot, uSeed;
uniform mat3 uRot;
uniform vec4 uCoin;
uniform sampler2D uRelief;   // r height, gb normal, a cavity AO
uniform sampler2D uSurf;     // r serial ink, g cut ticks, b relief albedo
out vec4 fragColor;

const float ASPECT = 1.03, CAM = 3.0, RADIUS = 0.06;
const float H0 = 0.45;       // relief height that sits exactly on the foil plane (zero parallax)
const float PAR = 0.12;      // uv shift per unit height at full tilt
const int STEPS = 24;
vec2 gDx, gDy;               // texture footprint, taken in uniform control flow

vec4 hash4(vec2 p) {
  vec4 p4 = fract(p.xyxy * vec4(0.1031, 0.1030, 0.0973, 0.1099));
  p4 += dot(p4, p4.wzxy + 33.33);
  return fract((p4.xxyz + p4.yzzw) * p4.zywx);
}

float stickerSD(vec2 p) {
  vec2 q = abs(p) - vec2(0.5, 0.5 * ASPECT) + RADIUS;
  return length(max(q, 0.0)) + min(max(q.x, q.y), 0.0) - RADIUS;
}

vec2 toUV(vec2 P) { return P * vec2(1.0, 1.0 / ASPECT); }
vec4 relief(vec2 P) { return textureGrad(uRelief, toUV(P), gDx, gDy); }

// approx. signed distance to the coin's oval edge, outward normal, angle around the rim
float coinSD(vec2 P, out vec2 nrm, out float ang) {
  float c = cos(uCoinRot), s = sin(uCoinRot);
  vec2 d = P - uCoin.xy;
  vec2 l = vec2(c * d.x + s * d.y, -s * d.x + c * d.y);
  vec2 ab = uCoin.zw;
  float rho = max(length(l / ab), 1e-4);
  vec2 g = l / (ab * ab) / rho;
  float gl = max(length(g), 1e-4);
  g /= gl;
  nrm = vec2(c * g.x - s * g.y, s * g.x + c * g.y);
  ang = atan(l.y / ab.y, l.x / ab.x);
  return (rho - 1.0) / gl;
}

// foil hue ramp (sampled from the reference frames): cyan-green .. lime .. yellow-green .. warm gold
vec3 foil(float k) {
  vec3 c = mix(vec3(0.05, 0.75, 0.50), vec3(0.12, 0.82, 0.20), smoothstep(-1.0, -0.5, k));
  c = mix(c, vec3(0.33, 0.87, 0.03), smoothstep(-0.5, 0.0, k));
  c = mix(c, vec3(0.55, 0.86, 0.04), smoothstep(0.0, 0.5, k));
  c = mix(c, vec3(0.80, 0.86, 0.08), smoothstep(0.5, 0.95, k));
  return mix(c, vec3(0.96, 0.80, 0.16), smoothstep(0.95, 1.4, k));
}

vec3 sparkles(vec2 P, float px) {
  vec3 acc = vec3(0.0);
  vec2 g = P * 70.0;                          // a few pin-point glints
  vec4 r = hash4(floor(g) + uSeed);
  if (r.x > 0.985) {
    float d = length(fract(g) - 0.2 - 0.6 * r.yz);
    float tw = pow(max(0.0, sin(6.283 * r.w + dot(uTilt, (r.yz - 0.5) * 18.0) + 2.5 * uTilt.x)), 24.0);
    acc += 1.6 * tw * (1.0 - smoothstep(0.0, max(0.13, px * 70.0), d)) * mix(vec3(0.45, 0.95, 1.0), vec3(0.9, 1.0, 1.0), r.y);
  }
  g = P * 9.0;                                // soft cyan blooms
  r = hash4(floor(g) + uSeed + 17.0);
  if (r.x > 0.7) {
    float d = length(fract(g) - 0.25 - 0.5 * r.yz);
    float tw = pow(max(0.0, sin(6.283 * r.w + dot(uTilt, (r.zy - 0.5) * 10.0))), 40.0);
    acc += tw * exp(-d * d * 60.0) * vec3(0.4, 0.85, 1.0) * 0.8;
  }
  return acc;
}

vec3 sticker(vec2 P, vec3 V, vec3 L, float sd, float px) {
  // Parallax occlusion: march from the top of the relief down until the view ray dips under the height field.
  vec2 par = -uTilt * PAR;
  float above = 1.0, below = 1.0;
  for (int i = 0; i <= STEPS; i++) {
    below = 1.0 - float(i) / float(STEPS);
    if (relief(P + par * (below - H0)).r >= below) break;
    above = below;
  }
  for (int i = 0; i < 6; i++) {               // binary refine: crisp coin walls
    float m = 0.5 * (above + below);
    if (relief(P + par * (m - H0)).r >= m) below = m; else above = m;
  }
  float th = 0.5 * (above + below);
  vec2 Ph = P + par * (th - H0);

  vec4 R = relief(Ph);
  vec3 N = vec3(textureGrad(uRelief, toUV(Ph), gDx * 2.0, gDy * 2.0).gb * 2.0 - 1.0, 0.0); // softened normals
  N.z = sqrt(max(0.0, 1.0 - dot(N.xy, N.xy)));
  float alb = textureGrad(uSurf, toUV(Ph), gDx, gDy).b;
  vec2 wn; float ang;
  float dC = coinSD(Ph, wn, ang);
  float wall = (1.0 - smoothstep(0.0008 + 0.4 * px, 0.0008 + 1.6 * px, abs(dC))) * (1.0 - smoothstep(0.82, 0.85, th))
             * smoothstep(0.5, 1.5, abs(dot(wn, par)) * 0.75 / px);   // ray hit the coin's side; fades in once the wall spans ~1 px
  float onCoin = step(dC, 0.0) * (1.0 - wall);
  N = normalize(mix(N, vec3(wn, 0.3), wall));

  vec3 Vh = normalize(vec3(V.xy * 2.2, V.z));  // holograms over-react to view angle
  vec3 H = normalize(L + Vh);
  float tl = length(uTilt);
  float k = 0.55 * tl * tl + 0.9 * dot(uTilt, vec2(-0.45, -0.89))
          - 0.4 * (P.y - 0.5) - 0.2 * (P.x - 0.5)
          + 0.45 * dot(N.xy, vec2(0.6, -0.8)) + 0.12 * onCoin;
  float shade = (1.0 + 1.05 * dot(N.xy, H.xy)) * mix(1.0, R.a, 0.8) * alb * (0.82 + 0.18 * th)   // deeper = dimmer
              * (1.0 + 0.06 * onCoin) * (1.0 - 0.2 * tl * tl);
  vec3 col = foil(k) * shade;
  col = mix(col, vec3(0.82, 1.0, 0.5), smoothstep(1.05, 1.6, shade) * 0.4);
  col += vec3(0.30, 0.40, 0.10) * pow(max(dot(N, H), 0.0), 40.0) * 0.45;

  if (wall > 0.0) {                            // coin side wall: dark line right under the lip, lit below, dim at the foot
    vec3 w = foil(k + 0.3) * (0.55 + 0.55 * max(0.0, dot(N, H)));
    w *= mix(0.45, 1.0, smoothstep(0.1, 0.6, th));
    col = mix(col, mix(w, vec3(0.12, 0.16, 0.03), 0.75 * smoothstep(0.66, 0.72, th) * (1.0 - smoothstep(0.78, 0.82, th))), wall);
  }

  // the whole foil "lights up" around one viewing angle, like a real hologram catching the light
  vec2 fl = uTilt - vec2(-0.35, -0.45);
  col *= 1.0 + 0.28 * exp(-dot(fl, fl) / 0.25);
  float sb = dot(P - vec2(0.5, 0.515), vec2(0.8, 0.6)) + 0.6 * uTilt.x + 0.45 * uTilt.y + 0.05 * N.x;
  col = 1.0 - (1.0 - col) * (1.0 - vec3(0.22, 0.30, 0.07) * exp(-sb * sb / 0.03));   // sweeping sheen band, screen blend so it can't clip
  col += sparkles(P, px);
  col *= 0.975 + 0.05 * hash4(floor(P * 1400.0)).x;      // foil grain

  // printed layer, no parallax: cut ticks, then serial ink
  vec4 S = textureGrad(uSurf, toUV(P), gDx, gDy);
  col = mix(col, vec3(0.10, 0.15, 0.06), S.g * 0.85);
  col += vec3(0.5, 0.9, 1.0) * S.g * 1.4 * pow(max(0.0, sin(dot(P, vec2(17.0, 11.0)) + 4.0 * uTilt.x - 3.0 * uTilt.y)), 8.0);
  col = mix(col, vec3(0.02, 0.025, 0.02), S.r);
  col += 0.1 * smoothstep(-0.006, 0.0, sd) * (1.0 - S.r);  // light catching the cut edge
  return col;
}

vec3 battery(vec2 p) {
  vec3 c = vec3(0.16, 0.165, 0.175) + 0.02 * p.y;
  float r = length(p - vec2(-1.1, 1.3));                    // concentric arc graphic
  float f = abs(fract(r / 0.032) - 0.5) * 0.032;
  float w = fwidth(r);
  float line = 1.0 - smoothstep(0.003 - w, 0.003 + w, f);
  c = mix(c, vec3(0.43, 0.44, 0.46), line * smoothstep(1.2, 1.35, r) * (1.0 - smoothstep(2.9, 3.1, r)) * 0.8);
  float sh = stickerSD(p - vec2(0.007, -0.012));
  c *= 1.0 - 0.5 * (1.0 - smoothstep(-0.005, 0.04, sh));    // soft shadow under the sticker
  vec2 hp = p + uTilt * vec2(0.8, -0.8);
  return c + 0.045 * exp(-dot(hp, hp) * 0.7);               // broad plastic sheen
}

void main() {
  // ray from the camera onto the rotated sticker/battery plane
  vec2 q = (gl_FragCoord.xy - 0.5 * uRes) / uSize;
  vec3 ro = vec3(0.0, 0.0, CAM), rd = normalize(vec3(q, -CAM));
  vec3 n = uRot[2];
  mat3 Ri = transpose(uRot);
  vec3 lp = Ri * (ro + rd * (-dot(ro, n) / dot(rd, n)));
  vec3 V = Ri * -rd, L = Ri * normalize(vec3(-0.4, 0.55, 0.75));
  V.y = -V.y; L.y = -L.y;                                   // into sticker texture space (y down)

  vec2 P = vec2(lp.x + 0.5, 0.5 * ASPECT - lp.y);           // sticker-width units, origin top-left
  gDx = dFdx(toUV(P)); gDy = dFdy(toUV(P));
  float px = max(length(dFdx(P)), length(dFdy(P)));
  float sd = stickerSD(lp.xy), aa = fwidth(sd);
  vec3 col = battery(lp.xy);
  if (sd < aa) col = mix(col, sticker(P, V, L, sd, px), smoothstep(aa, -aa, sd));
  vec2 sv = gl_FragCoord.xy / uRes - 0.5;
  col *= 1.0 - 0.45 * dot(sv, sv);
  col += (hash4(gl_FragCoord.xy).x - 0.5) / 255.0;          // dither
  fragColor = vec4(col, 1.0);
}`;

// ---------- page bootstrap ----------
const params = new URLSearchParams(location.search);
const forced = (params.get('tilt') || '').split(',').map(s => s.trim() === '' ? NaN : Number(s));
const hint = document.getElementById('hint');
try {
  createHoloSticker(document.getElementById('c'), {
    text: params.get('text') || undefined,
    seed: params.has('seed') ? Number(params.get('seed')) : undefined,
    tilt: forced.length === 2 && forced.every(Number.isFinite) ? forced.map(v => Math.max(-1, Math.min(1, v))) : null,
    reducedMotion: matchMedia('(prefers-reduced-motion: reduce)').matches,
    tiltButton: document.getElementById('tilt-btn'),
    onSource: s => { hint.textContent = { mouse: 'Move the pointer to tilt', touch: 'Drag to tilt', gyro: 'Tilt your phone' }[s] || ''; },
  });
} catch (e) {
  document.getElementById('err').textContent = e.message;
  document.title = 'ERROR: ' + e.message.split('\n')[0];
}
</script>
